<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kavana AI - Interactive Story Roleplay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0c0f17;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* TOP HEADER */
    .app-header {
      background: #121824;
      border-bottom: 1px solid #1f293d;
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .back-btn {
      display: none;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 10px;
      color: #94a3b8;
    }
    .free-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #3b1e08;
      border: 1px solid #d97706;
      color: #fde68a;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    /* MAIN APP AREA */
    .main-wrap {
      flex: 1;
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* FEED VIEW */
    #feedScreen {
      display: block;
      padding: 14px;
    }
    .search-box-wrap {
      margin-bottom: 12px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #161e2e;
      border: 1px solid #24324a;
      border-radius: 12px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #8b5cf6;
    }
    .pill-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding-bottom: 4px;
    }
    .category-pill {
      background: #161e2e;
      border: 1px solid #24324a;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .category-pill.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: #ffffff;
    }
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 24px;
    }
    .story-card {
      background: #141c2b;
      border: 1px solid #223049;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .story-card:active {
      transform: scale(0.98);
      border-color: #8b5cf6;
    }
    .card-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      background: #3b0764;
      color: #d8b4fe;
      border: 1px solid #6b21a8;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .card-snippet {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .card-footer {
      font-size: 10px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .online-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .char-avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* STORY DETAIL SHEET / MODAL */
    #detailModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: flex-end;
    }
    .sheet-content {
      background: #121824;
      border-top: 1px solid #2a3852;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px 18px 28px 18px;
    }
    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .close-sheet-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .media-shelf {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0 16px 0;
    }
    .shelf-card {
      height: 105px;
      background: #161e2e;
      border: 1px solid #28374f;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #94a3b8;
      gap: 6px;
    }
    .shelf-icon {
      font-size: 20px;
    }
    .chat-now-cta {
      width: 100%;
      background: linear-gradient(135deg, #9333ea, #4f46e5);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 14px;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }

    /* IN-STORY CHAT SCREEN */
    #chatScreen {
      display: none;
      flex-direction: column;
      height: calc(100vh - 58px);
      background: #0c0f17;
    }
    .scene-context-bar {
      background: #141c2b;
      border-bottom: 1px solid #1f2a3e;
      padding: 9px 14px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user-row {
      display: flex;
      justify-content: flex-end;
    }
    .user-bubble {
      max-width: 85%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 16px 16px 2px 16px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .ai-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .ai-bubble {
      max-width: 85%;
      background: #161e2e;
      border: 1px solid #24324a;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 16px 16px 16px 2px;
      font-size: 13px;
      line-height: 1.45;
    }
    .ai-name-label {
      font-size: 10px;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 4px;
      display: block;
    }
    .rp-action {
      color: #d8b4fe;
      font-style: italic;
    }
    .quick-chips-shelf {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 12px;
      background: #121824;
      border-top: 1px solid #1c2536;
    }
    .chip-button {
      background: #1a2336;
      border: 1px solid #2d3d5a;
      color: #cbd5e1;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-button:active {
      background: #8b5cf6;
      color: #ffffff;
    }
    .chat-bottom-form {
      background: #121824;
      border-top: 1px solid #1c2536;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
    }
    .chat-text-input {
      flex: 1;
      background: #182234;
      border: 1px solid #283750;
      border-radius: 12px;
      color: #ffffff;
      padding: 10px 14px;
      font-size: 13px;
      outline: none;
    }
    .chat-text-input:focus {
      border-color: #8b5cf6;
    }
    .submit-plane-btn {
      background: #8b5cf6;
      border: none;
      width: 44px;
      height: 42px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .typing-status {
      display: none;
      padding: 4px 14px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="app-header">
    <div class="brand-group" onclick="showCatalog()">
      <button id="headerBackBtn" class="back-btn" onclick="event.stopPropagation(); showCatalog();">&#8592;</button>
      <div id="brandBadge" class="brand-icon">K</div>
      <div>
        <div id="headerTitle" class="brand-title">KAVANA</div>
        <div id="headerSubtitle" class="brand-sub">Interactive Stories (28)</div>
      </div>
    </div>
    <div class="free-pill">
      <span>&#9874; Free (0/msg)</span>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="main-wrap">

    <!-- FEED SCREEN -->
    <section id="feedScreen">
      <!-- Search Input -->
      <div class="search-box-wrap">
        <input 
          type="text" 
          id="storySearchInput" 
          class="search-input" 
          placeholder="Search 28+ stories, doctors, officers, agents..." 
          oninput="handleSearchFilter(this.value)"
        />
      </div>

      <!-- Categories Pills -->
      <div class="pill-tabs no-scrollbar">
        <button class="category-pill active" onclick="setCategory('All', this)">All Stories</button>
        <button class="category-pill" onclick="setCategory('Crime', this)">Crime & Narcotics</button>
        <button class="category-pill" onclick="setCategory('Medical', this)">Medical Drama</button>
        <button class="category-pill" onclick="setCategory('Romance', this)">Romance & Royal</button>
        <button class="category-pill" onclick="setCategory('Thriller', this)">Thriller & Mystery</button>
      </div>

      <!-- Stories Container -->
      <div id="storiesContainer" class="cards-list"></div>
    </section>

    <!-- ACTIVE CHAT SCREEN -->
    <section id="chatScreen">
      <!-- Scene Context Bar -->
      <div id="chatSceneBar" class="scene-context-bar"></div>

      <!-- Dialogue History -->
      <div id="chatHistory" class="messages-container"></div>

      <!-- Typing Indicator -->
      <div id="chatTypingBar" class="typing-status">
        <span id="charTypingName">Character</span> is reacting...
      </div>

      <!-- Quick Dialogue Choices -->
      <div id="chatChoicesShelf" class="quick-chips-shelf no-scrollbar"></div>

      <!-- Input Form -->
      <form class="chat-bottom-form" onsubmit="handleSendDialogue(event)">
        <input 
          type="text" 
          id="dialogueInput" 
          class="chat-text-input" 
          placeholder="Type your response or *action*..." 
          autocomplete="off"
        />
        <button type="submit" class="submit-plane-btn">&#10148;</button>
      </form>
    </section>

  </main>

  <!-- KAVANA STORY DETAIL SHEET (Pop-up) -->
  <div id="detailModal">
    <div class="sheet-content">
      <div class="sheet-top">
        <span id="modalTagBadge" class="card-badge">Roleplay</span>
        <button class="close-sheet-btn" onclick="dismissModal()">&#10005;</button>
      </div>

      <h2 id="modalStoryTitle" style="font-size:16px; font-weight:800; color:#ffffff; margin:0 0 10px 0;">Story Title</h2>

      <div style="font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; margin-bottom:6px;">Media Library (3)</div>
      <div class="media-shelf">
        <div class="shelf-card">
          <span class="shelf-icon">&#9654;</span>
          <span>Teaser</span>
        </div>
        <div class="shelf-card">
          <span class="shelf-icon">&#128247;</span>
          <span>Scene 1</span>
        </div>
        <div class="shelf-card">
          <span class="shelf-icon">&#128196;</span>
          <span>Clue File</span>
        </div>
      </div>

      <div style="font-size:11px; font-weight:700; color:#cbd5e1; text-transform:uppercase; margin-bottom:4px;">About Story</div>
      <p id="modalStoryAbout" style="font-size:12px; color:#94a3b8; line-height:1.45; margin:0 0 14px 0;"></p>

      <div style="padding:10px 0; border-top:1px solid #1f2a3e; border-bottom:1px solid #1f2a3e; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#cbd5e1;">
        <div>Creator: <strong style="color:#ffffff;">Pranav &#10004;</strong></div>
        <div>&#11088; 4.84 (46.2k chats)</div>
      </div>

      <button class="chat-now-cta" onclick="launchChatSession()">Chat now</button>
    </div>
  </div>

  <!-- SCRIPT ENGINE: ALL 28 EXPANDED STORIES WITH ADVANCED BRANCHING -->
  <script>
    const STORIES = [
      // 1. Dr. Raina (Screenshot 1)
      {
        id: "dr_raina",
        title: "Dr. Raina - 6 Mahine Ka Jhooth: Maut Jo Aayi Hi Nahi",
        category: "Medical",
        character: "Dr. Raina",
        role: "The Patient (Diagnosed 6 Months Ago)",
        tag: "Medical Mystery",
        color: "#059669",
        about: "Dr. Raina has been your oncologist for six months. You trusted her with your death. You quit your job, reconciled with your father, found love. Now she's called you to her office, blinds drawn, hands trembling. Something is very wrong.",
        opening: "*Her hands are flat on the desk, pressing down like she's holding something in place. She doesn't look up when you sit.* Close the door, please. *A beat. Then she meets your eyes, and something in her face has cracked.* I need to tell you something about your diagnosis. And I need you to let me finish before you speak.",
        choices: [
          "*I lock the door.* What did the new biopsy say, Raina? Speak clearly.",
          "Raina, my father and fiance are waiting outside. Why are your hands shaking?",
          "Are you telling me I'm not dying? Answer me right now!"
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("not dying") || t.includes("dying") || t.includes("cancer") || t.includes("jhooth")) {
            return "*She pulls two identical pathology envelopes with trembling fingers.* The blood sample from six months ago... wasn't yours. You never had Stage IV lymphoma. The hospital board switched your file with a terminal patient named Mohan Verma so they could test unregistered immuno-therapy drugs on you.";
          } else if (t.includes("father") || t.includes("fiance") || t.includes("outside") || t.includes("family")) {
            return "*Her breath hitches and she covers her eyes.* Don't bring them in yet. If the Medical Superintendent discovers that I know about the falsified trial data, neither of us will leave this ward alive. There are guards in the corridor.";
          } else if (t.includes("biopsy") || t.includes("lock") || t.includes("door") || t.includes("clearly")) {
            return "*She leans forward, sliding a confidential hospital registry across the table.* Look at this serial code. You resigned from everything you built because of a manufactured diagnosis. You gave away your savings. I couldn't stay silent anymore.";
          } else {
            return "*She whispers urgently, checking the office door handle.* Every test result you were given was forged by the administration. I have the original blood report in my bag. We have less than twenty minutes before the night shift supervisor audits my terminal.";
          }
        }
      },

      // 2. Mahi (Screenshot 2)
      {
        id: "mahi_cocaine",
        title: "Mahi - College Campus Aur Cocaine",
        category: "Crime",
        character: "Officer Mahi",
        role: "Campus Student Suspect",
        tag: "Narcotics Probe",
        color: "#d97706",
        about: "Mahi ek narcotics officer hai jo college campuses se chalne wali cocaine supply chain ko track kar rahi hai. Abhi-abhi ek student overdose se mar gaya hai. Tum bhi usi college ke student ho, aur ab interrogation mein tum par bhi shaq aa gaya hai.",
        opening: "*Interrogation room mein woh file khol kar tumhara naam highlight karke saamne rakh deti hai* Sach bataoge, ya main bataun tumhara naam supply chain mein kahan aata hai?",
        choices: [
          "Mahi, main sirf Kabir ka roommate tha! Overdose ke waqt main library mein tha.",
          "*Maine file dekhi aur muskura diya.* Agar main supplier hota, toh DGP ko call chala gaya hota.",
          "Kabir ne marne se pehle mujhe ek locker key di thi... par pehle mujhe protection guarantee chahiye."
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("key") || t.includes("locker") || t.includes("protection")) {
            return "*Mahi table par jhukti hai, uski aankhein narrow ho jaati hain.* Locker number batao! Main wada karti hoon ki jab tak yeh syndicate pakda nahi jaata, CBI witness protection tumhare saath hogi. Chabi kahan hai?";
          } else if (t.includes("roommate") || t.includes("library") || t.includes("innocent")) {
            return "*Woh file zor se band karti hai.* Library CCTV footage delete ho chuka hai! Tumhe lagta hai yeh itefaaq hai? Pure campus mein sirf do logon ke paas server room ka password tha—Kabir, aur tum.";
          } else if (t.includes("dgp") || t.includes("supplier") || t.includes("muskura")) {
            return "*Mahi tumhari aankhon mein dekhti hai aur table par hathiyaar rakh deti hai.* DGP ka naam lekar yahan koi nahi bachega. Kabir ke phone se jo aakhri aawaz record hui hai, woh tumhari hai. Explain karo ise!";
          } else {
            return "*Mahi tumhari taraf jhukti hai.* Hostels ke andar 50 lakh ka maal transit hua hai pichle teen dinon mein. Agar tum sach nahi bologi, toh agli peshi magistrate ke samne non-bailable warrant par hogi.";
          }
        }
      },

      // 3. Officer Purvi (Screenshot 3)
      {
        id: "purvi_bachpan",
        title: "Officer Purvi - Bika Hua Bachpan",
        category: "Crime",
        character: "Officer Purvi",
        role: "NGO Volunteer & Key Witness",
        tag: "CBI Investigation",
        color: "#2563eb",
        about: "Purvi ek CBI officer ek sitting MLA ke khilaaf illegal adoption racket ka case bana rahi hai, jo NGOs ke through chal raha tha. Money trail mil chuka hai, par use ek insaan ki gawahi chahiye—tum wahan volunteer the isliye officer Purvi tumse baat karne bulati hai.",
        opening: "*She taps a surveillance photo of the shelter home on the desk.* Main jaanti hoon MLA ke log tumhare peeche hain. Par agar tumne court mein gawahi nahi di, toh agle hafte 14 aur bachhe border cross kar diye jayenge. Will you sign the statement?",
        choices: [
          "Purvi ji, MLA ke goondon ne kal raat mere ghar par firing ki thi. Meri behan safe nahi hai.",
          "*I pull out a pen.* Statement kahan sign karna hai? Un bacchon ko bachana meri zimmewari hai.",
          "Sirf meri gawahi se MLA nahi fasega. Mere paas ledger accounts ki digital copy hai."
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("ledger") || t.includes("digital") || t.includes("accounts") || t.includes("copy")) {
            return "*Purvi ki aankhein chamak uthti hain.* Digital copy? Tumhe andaza bhi nahi hai tumne kitna bada hathiyar diya hai hume. Pen drive mujhe do, kal subah tak MLA ke arrest warrants tayyar honge.";
          } else if (t.includes("behan") || t.includes("firing") || t.includes("threat") || t.includes("safe")) {
            return "*Purvi tumhara haath thambti hai.* Tumhari behan ko do ghante pehle humare safehouse shift kar diya gaya hai. Abhi uski hifazat CBI ke haath mein hai. Mujh par bharosa rakho.";
          } else if (t.includes("sign") || t.includes("pen") || t.includes("statement")) {
            return "*Purvi file aage badhati hai.* Yahan sign karo. Kal tumhara 164 ka bayaan magistrate ke samne darj hoga. Iske baad peeche hatne ka koi rasta nahi hoga.";
          } else {
            return "*Purvi photo par ungli rakhti hai.* Yeh dekho. Yeh wahi bacha hai jise kal subah truck mein bithaya gaya tha. Hamare paas sirf 12 ghante bache hain. Tumhara faisla inki zindagi tay karega.";
          }
        }
      },

      // 4. Kabir - Corporate Acquisition
      {
        id: "kabir_deal",
        title: "Kabir - Corporate Acquisition & Revenge",
        category: "Romance",
        character: "Kabir Singhania",
        role: "Rival Family Successor",
        tag: "Enemies to Lovers",
        color: "#475569",
        about: "Kabir buys out your bankrupt family empire and demands that you work directly as his personal chief of staff for one year.",
        opening: "*He slides the buyout agreement across the table with a cold smirk.* Sign line seven, and your family keeps the mansion. But for the next year, you answer directly to me.",
        choices: [
          "I'd rather burn the company than take orders from you.",
          "Give me veto power on board decisions, Kabir.",
          "Why do you want me here, Kabir? Tell the real truth."
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("veto") || t.includes("power") || t.includes("board")) {

    var activeStory = null;
    var storyHistory = {};

    // RENDER STORIES CATALOG INSTANTLY
    function renderStoriesCatalog(list) {
      var box = document.getElementById("storiesContainer");
      if (!list || list.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:30px; font-size:12px; color:#64748b;">No stories found.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        html += '<div class="story-card" onclick="openStorySheet(\'' + s.id + '\')">';
        html += '  <div style="flex:1;">';
        html += '    <span class="card-badge">' + s.tag + '</span>';
        html += '    <h3 class="card-title">' + s.title + '</h3>';
        html += '    <p class="card-snippet">' + s.about + '</p>';
        html += '    <div class="card-footer">';
        html += '      <span class="online-indicator"></span>';
        html += '      <span>Talk to: <strong style="color:#ffffff;">' + s.character + '</strong></span>';
        html += '      <span>&bull;</span>';
        html += '      <span style="color:#c084fc;">Role: ' + s.role + '</span>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="char-avatar-circle" style="background-color:' + s.color + ';">' + s.character.charAt(0) + '</div>';
        html += '</div>';
      }
      box.innerHTML = html;
    }

    // CATEGORY FILTERING
    function setCategory(cat, btn) {
      var pills = document.querySelectorAll(".category-pill");
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.remove("active");
      }
      if (btn) btn.classList.add("active");

      if (cat === "All") {
        renderStoriesCatalog(STORIES);
      } else {
        var filtered = [];
        for (var j = 0; j < STORIES.length; j++) {
          if (STORIES[j].category.toLowerCase() === cat.toLowerCase()) {
            filtered.push(STORIES[j]);
          }
        }
        renderStoriesCatalog(filtered);
      }
    }

    // SEARCH FILTERING
    function handleSearchFilter(val) {
      var q = val.toLowerCase().trim();
      var results = [];
      for (var i = 0; i < STORIES.length; i++) {
        var s = STORIES[i];
        if (s.title.toLowerCase().indexOf(q) !== -1 ||
            s.character.toLowerCase().indexOf(q) !== -1 ||
            s.about.toLowerCase().indexOf(q) !== -1 ||
            s.tag.toLowerCase().indexOf(q) !== -1) {
          results.push(s);
        }
      }
      renderStoriesCatalog(results);
    }

    // MODAL SHEET CONTROLS
    function openStorySheet(id) {
      for (var i = 0; i < STORIES.length; i++) {
        if (STORIES[i].id === id) {
          activeStory = STORIES[i];
          break;
        }
      }
      if (!activeStory) return;

      document.getElementById("modalStoryTitle").innerText = activeStory.title;
      document.getElementById("modalTagBadge").innerText = activeStory.tag;
      document.getElementById("modalStoryAbout").innerText = activeStory.about;
      document.getElementById("detailModal").style.display = "flex";
    }

    function dismissModal() {
      document.getElementById("detailModal").style.display = "none";
    }

    // LAUNCH CHAT
    function launchChatSession() {
      dismissModal();
      document.getElementById("feedScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";
      document.getElementById("headerBackBtn").style.display = "inline-block";

      document.getElementById("headerTitle").innerText = activeStory.character;
      document.getElementById("headerSubtitle").innerText = "Role: " + activeStory.role;
      document.getElementById("chatSceneBar").innerText = activeStory.about;
      document.getElementById("charTypingName").innerText = activeStory.character;

      if (!storyHistory[activeStory.id] || storyHistory[activeStory.id].length === 0) {
        storyHistory[activeStory.id] = [
          { sender: "ai", text: activeStory.opening }
        ];
      }

      renderDialogueThread();
      renderDialogueChips();
    }

    function showCatalog() {
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("feedScreen").style.display = "block";
      document.getElementById("headerBackBtn").style.display = "none";
      document.getElementById("headerTitle").innerText = "KAVANA";
      document.getElementById("headerSubtitle").innerText = "Interactive Stories (28)";
    }

    // CHAT RENDERING
    function renderDialogueThread() {
      var box = document.getElementById("chatHistory");
      var messages = storyHistory[activeStory.id] || [];
      var html = "";

      for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        if (m.sender === "user") {
          html += '<div class="user-row">';
          html += '  <div class="user-bubble">' + formatRpText(m.text) + '</div>';
          html += '</div>';
        } else {
          html += '<div class="ai-row">';
          html += '  <div class="char-avatar-circle" style="width:28px; height:28px; font-size:11px; background-color:' + activeStory.color + ';">' + activeStory.character.charAt(0) + '</div>';
          html += '  <div class="ai-bubble">';
          html += '    <span class="ai-name-label">' + activeStory.character + '</span>';
          html += '    ' + formatRpText(m.text);
          html += '  </div>';
          html += '</div>';
        }
      }

      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    function renderDialogueChips() {
      var bar = document.getElementById("chatChoicesShelf");
      if (!activeStory.choices || activeStory.choices.length === 0) {
        bar.innerHTML = "";
        return;
      }
      var html = "";
      for (var i = 0; i < activeStory.choices.length; i++) {
        var c = activeStory.choices[i];
        html += '<button type="button" class="chip-button" onclick="selectChipChoice(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
      }
      bar.innerHTML = html;
    }

    function selectChipChoice(text) {
      document.getElementById("dialogueInput").value = text;
      handleSendDialogue(new Event("submit"));
    }

    function handleSendDialogue(e) {
      if (e && e.preventDefault) e.preventDefault();
      var input = document.getElementById("dialogueInput");
      var text = input.value.trim();
      if (!text || !activeStory) return;

      storyHistory[activeStory.id].push({ sender: "user", text: text });
      input.value = "";
      renderDialogueThread();

      var typingNotice = document.getElementById("chatTypingBar");
      typingNotice.style.display = "block";
      var box = document.getElementById("chatHistory");
      box.scrollTop = box.scrollHeight;

      setTimeout(function() {
        var response = activeStory.branch(text);
        typingNotice.style.display = "none";
        storyHistory[activeStory.id].push({ sender: "ai", text: response });
        renderDialogueThread();
      }, 650);
    }

    function formatRpText(str) {
      var safe = str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return safe.replace(/\*(.*?)\*/g, '<span class="rp-action">$1</span>');
    }

    // INITIALIZE FEED IMMEDIATELY
    renderStoriesCatalog(STORIES);
  </script>
</body>
