<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kavana AI - Interactive Hinglish Roleplay</title>
  
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kavana AI">

  <!-- Embedded PWA Manifest (No extra files or keys needed) -->
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22Kavana%20AI%20-%20Hinglish%20Roleplay%22%2C%22short_name%22%3A%22Kavana%20AI%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23090d16%22%2C%22theme_color%22%3A%22%23090d16%22%7D">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #090d16;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* TOP HEADER */
    .app-header {
      background: rgba(14, 20, 33, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 60;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .back-btn {
      display: none;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: #f1f5f9;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 17px;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.5);
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 10px;
      color: #94a3b8;
    }
    .free-pill {
      background: rgba(217, 119, 6, 0.18);
      border: 1px solid #d97706;
      color: #fbbf24;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    /* MAIN CONTAINER */
    .main-wrap {
      flex: 1;
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* FEED VIEW */
    #feedScreen {
      display: block;
      padding: 14px;
    }
    .search-box {
      width: 100%;
      background: #131b2b;
      border: 1px solid #23314a;
      border-radius: 14px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      margin-bottom: 14px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .search-box:focus {
      border-color: #8b5cf6;
    }
    .pill-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }
    .category-pill {
      background: #131b2b;
      border: 1px solid #24324d;
      color: #94a3b8;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .category-pill.active {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-color: #8b5cf6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 30px;
    }

    /* CARDS */
    .story-card {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .story-card:active {
      transform: scale(0.98);
      border-color: #8b5cf6;
    }
    .card-photo {
      width: 115px;
      height: 145px;
      object-fit: cover;
      flex-shrink: 0;
      filter: brightness(0.95);
    }
    .card-info {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: #3b0764;
      color: #e9d5ff;
      border: 1px solid #7e22ce;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .card-meta {
      font-size: 10px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* MODAL POPUP */
    #detailModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: flex-end;
      backdrop-filter: blur(8px);
    }
    .sheet-box {
      background: #0f1626;
      border-top: 1px solid #28374f;
      border-radius: 26px 26px 0 0;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px 18px 30px 18px;
      position: relative;
    }
    .modal-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 14px;
      border: 1px solid #25334c;
    }
    .close-sheet-btn {
      position: absolute;
      top: 26px;
      right: 26px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-start-btn {
      width: 100%;
      background: linear-gradient(135deg, #9333ea, #4f46e5);
      border: none;
      border-radius: 16px;
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      padding: 15px;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }

    /* CHAT SCREEN */
    #chatScreen {
      display: none;
      flex-direction: column;
      height: calc(100vh - 58px);
      background: #090d16;
    }
    .chat-character-bar {
      background: #111827;
      border-bottom: 1px solid #1f293d;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-char-pic {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #8b5cf6;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user-row {
      display: flex;
      justify-content: flex-end;
    }
    .user-bubble {
      max-width: 85%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #ffffff;
      padding: 11px 15px;
      border-radius: 18px 18px 4px 18px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    .ai-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .ai-bubble {
      max-width: 85%;
      background: #121a2a;
      border: 1px solid #202d44;
      color: #e2e8f0;
      padding: 11px 15px;
      border-radius: 18px 18px 18px 4px;
      font-size: 13px;
      line-height: 1.5;
    }
    .ai-name-tag {
      font-size: 10px;
      font-weight: 800;
      color: #c084fc;
      margin-bottom: 3px;
      display: block;
    }
    .rp-act {
      color: #d8b4fe;
      font-style: italic;
    }
    .choices-shelf {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: #0f1624;
      border-top: 1px solid #1c2536;
    }
    .chip-btn {
      background: #172133;
      border: 1px solid #2b3b55;
      color: #cbd5e1;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn:active {
      background: #8b5cf6;
      color: #ffffff;
    }
    .chat-form {
      background: #0f1624;
      border-top: 1px solid #1c2536;
      padding: 9px 12px;
      display: flex;
      gap: 8px;
    }
    .chat-input {
      flex: 1;
      background: #151e30;
      border: 1px solid #26354e;
      border-radius: 14px;
      color: #ffffff;
      padding: 11px 14px;
      font-size: 13px;
      outline: none;
    }
    .chat-input:focus {
      border-color: #8b5cf6;
    }
    .send-btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .typing-box {
      display: none;
      padding: 4px 16px;
      font-size: 11px;
      color: #a78bfa;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand-group" onclick="showCatalog()">
      <button id="headerBackBtn" class="back-btn" onclick="event.stopPropagation(); showCatalog();">&#8592;</button>
      <div class="brand-icon">K</div>
      <div>
        <div id="headerTitle" class="brand-title">KAVANA</div>
        <div id="headerSubtitle" class="brand-sub">Interactive Stories (Hinglish)</div>
      </div>
    </div>
    <div class="free-pill">
      <span>&#9874; Free (0/msg)</span>
    </div>
  </header>

  <main class="main-wrap">

    <!-- FEED SCREEN -->
    <section id="feedScreen">
      <input 
        type="text" 
        class="search-box" 
        placeholder="Doctor, Officer, Haveli ya Romance search karo..." 
        oninput="handleSearchFilter(this.value)"
      />

      <div class="pill-tabs">
        <button class="category-pill active" onclick="setCategory('All', this)">Sabhi Kahaniyan</button>
        <button class="category-pill" onclick="setCategory('Medical', this)">Medical Mystery</button>
        <button class="category-pill" onclick="setCategory('Crime', this)">Crime & Narcotics</button>
        <button class="category-pill" onclick="setCategory('Romance', this)">Romance & Royal</button>
        <button class="category-pill" onclick="setCategory('Thriller', this)">Thriller & Suspense</button>
      </div>

      <div id="storiesContainer" class="cards-list"></div>
    </section>

    <!-- IN-STORY CHAT SCREEN -->
    <section id="chatScreen">
      <div class="chat-character-bar">
        <img id="chatHeaderPic" class="chat-char-pic" src="" alt="avatar" />
        <div style="flex:1;">
          <div id="chatHeaderName" style="font-size:13px; font-weight:800; color:#fff;"></div>
          <div id="chatHeaderRole" style="font-size:10px; color:#94a3b8;"></div>
        </div>
      </div>

      <div id="chatHistory" class="chat-messages"></div>

      <div id="chatTypingNotice" class="typing-box">
        <span id="charTypingName">Character</span> likh raha hai...
      </div>

      <div id="chatChoicesShelf" class="choices-shelf"></div>

      <form class="chat-form" onsubmit="handleSendDialogue(event)">
        <input 
          type="text" 
          id="dialogueInput" 
          class="chat-input" 
          placeholder="Apna jawab ya *action* yahan likho..." 
          autocomplete="off"
        />
        <button type="submit" class="send-btn">&#10148;</button>
      </form>
    </section>

  </main>

  <!-- STORY PREVIEW MODAL -->
  <div id="detailModal">
    <div class="sheet-box">
      <button class="close-sheet-btn" onclick="dismissModal()">&#10005;</button>
      <img id="modalCoverImg" class="modal-banner" src="" alt="Cover" />
      <span id="modalTagBadge" class="card-badge">Roleplay</span>
      <h2 id="modalStoryTitle" style="font-size:16px; font-weight:800; color:#ffffff; margin:6px 0 10px 0;"></h2>
      <div style="font-size:11px; font-weight:700; color:#cbd5e1; text-transform:uppercase; margin-bottom:4px;">Kahani Ka Scene</div>
      <p id="modalStoryAbout" style="font-size:12px; color:#94a3b8; line-height:1.5; margin:0 0 14px 0;"></p>
      <button class="chat-start-btn" onclick="launchChatSession()">Roleplay Chat Shuru Karein</button>
    </div>
  </div>

  <script>
    const STORIES = [
      {
        id: "dr_raina",
        title: "Dr. Raina - 6 Mahine Ka Jhooth: Maut Jo Aayi Hi Nahi",
        category: "Medical",
        character: "Dr. Raina",
        role: "The Patient (Diagnosed 6 Months Ago)",
        tag: "Medical Mystery",
        photo: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=500&q=80",
        about: "Dr. Raina pichle 6 mahine se aapki oncologist hai. Unhone kaha tha aap marne wale ho, toh aapne naukri chhod di, family se sulah kar li. Aaj unke cabin ke parde band hain, haath kaanp rahe hain aur file chupane ki koshish kar rahi hain.",
        opening: "*Cabin ka darwaza lock karne ke baad unke haath kaanp rahe hain. Woh table par jhukti hain aur dheemi aawaz mein kehti hain.* Darwaza band rakho please. *Aapki aankhon mein dekhti hain aur unka chehra darr se laal ho gaya hai.* Mujhe tumhari biopsy ke baare mein kuch batana hai... pehle meri poori baat suno bina chillaye.",
        choices: [
          "*Darwaza lock karta hoon.* Biopsy mein kya aaya hai Raina? Saaf-saaf batao!",
          "Raina, bahar mere papa aur fiance baithe hain. Tumhare haath kyun kaanp rahe hain?",
          "Kya tum keh rahi ho ki main marne wala nahi hoon? Sach bolo abhi!"
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("marne") || t.includes("nahi hoon") || t.includes("sach") || t.includes("jhooth")) {
            return "*Woh file table par patak deti hain, aankhon mein aansu aa jaate hain.* Tumhe kabhi Stage IV cancer tha hi nahi! Hospital Director ne Mohan Verma naam ke ek terminal patient ke saath tumhari files badal di thi, taaki tumhare sharir par illegal medical trials test kar sakein!";
          } else if (t.includes("papa") || t.includes("fiance") || t.includes("bahar") || t.includes("family")) {
            return "*Woh jaldi se aapka haath pakad kar rokti hain.* Unhe andar mat bulana! Agar Hospital Superintendent ko pata chala ki mujhe fake reports ka pata chal gaya hai, toh hum dono mein se koi is ward se zinda bahar nahi nikal payega!";
          } else {
            return "*Woh ek confidential registry table par slide karti hain.* Yeh dekho tumhara original serial code. Tumhe 6 mahine se jhooth bola ja raha tha! Tumne apni poori zindagi aur savings bech di us bimari ke liye jo tumhe thi hi nahi!";
          }
        }
      },
      {
        id: "mahi_cocaine",
        title: "Officer Mahi - College Campus Aur Cocaine",
        category: "Crime",
        character: "Officer Mahi",
        role: "Hostel Student Suspect",
        tag: "Narcotics Probe",
        photo: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=500&q=80",
        about: "Mahi ek fearless Narcotics Officer hai jo bade college campuses mein chalne wale drug racket ko tod rahi hai. Kal raat ek student ke overdose se marne ke baad interrogation room mein sabse pehla number aapka laga hai.",
        opening: "*Interrogation room mein file table par patak kar aapki aankhon mein ghoorti hai.* Sach bataoge ya main bataun ki campus supply chain mein tumhara naam kis-kis ke saath juda hua hai?",
        choices: [
          "Mahi ji, main sirf Kabir ka roommate tha! Overdose ke waqt main library mein tha.",
          "*Muskura kar file dekhi.* Agar main supplier hota, toh ab tak DGP ka phone aa gaya hota.",
          "Kabir ne marne se pehle mujhe ek locker key di thi... par mujhe CBI protection chahiye."
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("key") || t.includes("locker") || t.includes("chabi") || t.includes("protection")) {
            return "*Mahi table par aage jhukti hai, uski aawaz sanjeeda ho jaati hai.* Locker number batao foran! Main wada karti hoon jab tak syndicate pakda nahi jata, witness protection tumhare sath rahegi. Chabi kahan hai?";
          } else if (t.includes("roommate") || t.includes("library") || t.includes("innocent")) {
            return "*Woh CCTV screen ghumati hai.* Library ka server room kal raat 2 baje tamper hua tha! Poore college mein sirf do logon ke paas keys thi—Kabir aur tum. Explain karo ise!";
          } else {
            return "*Mahi apni pistol holster par haath rakhti hai.* DGP ka naam lekar yahan koi nahi bachega. Kabir ke phone se aakhri call tumhare number par gayi thi. Seedhe-seedhe batao consignment kahan chhupai hai?";
          }
        }
      },
      {
        id: "purvi_bachpan",
        title: "Officer Purvi - Bika Hua Bachpan",
        category: "Crime",
        character: "Officer Purvi",
        role: "NGO Volunteer & Key Witness",
        tag: "CBI Investigation",
        photo: "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=500&q=80",
        about: "CBI Officer Purvi ek sitting MLA ke chalaye ja rahe illegal orphanage racket ko benaqab kar rahi hai. Money trail mil chuka hai, bas aapki gavahi se 14 bacchon ki jaan bach sakti hai.",
        opening: "*Shelter home ki surveillance photo desk par rakhti hai.* Main jaanti hoon MLA ke gunde tumhare peeche lage hain. Par agar tumne court mein gavahi nahi di, toh agle hafte 14 aur masoom bache border cross kar diye jayenge. Will you sign the statement?",
        choices: [
          "Purvi ji, kal raat unhone mere ghar par firing ki thi. Meri family safe nahi hai.",
          "*Pen uthata hoon.* Statement kahan sign karna hai? Main un bacchon ko nahi chhodunga.",
          "Sirf mere bayan se MLA nahi fasega. Mere paas unke fake trust accounts ki digital copy hai."
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("copy") || t.includes("ledger") || t.includes("account") || t.includes("proof")) {
            return "*Purvi ki aankhein chamak uthti hain.* Digital copy?! Tumhe andaza bhi nahi hai tumne kitna bada hathiyar diya hai hume! Pendrive do, kal subah tak MLA ke non-bailable arrest warrant taiyar honge.";
          } else if (t.includes("family") || t.includes("firing") || t.includes("darr") || t.includes("safe")) {
            return "*Purvi aapka haath thambti hai.* Tumhari behan aur maa ko do ghante pehle humare safehouse shift kar diya gaya hai. Unki hifazat CBI ke hath mein hai, mujh par bharosa rakho.";
          } else {
            return "*Woh file khol kar samne karti hai.* Yahan sign karo. Kal tumhara 164 ka bayaan magistrate ke samne darj hoga. Iske baad unka koi gunda tumhara rasta nahi rok payega.";
          }
        }
      },
      {
        id: "kabir_deal",
        title: "Kabir - Corporate Badla & Mohabbat",
        category: "Romance",
        character: "Kabir Singhania",
        role: "Rival Business Family",
        tag: "Enemies to Lovers",
        photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=500&q=80",
        about: "Kabir ne aapki doobti hui company ke saare shares khareed liye hain. Shart bas ek hai: agle 1 saal tak aapko uske cabin mein personal assistant bankar kaam karna hoga.",
        opening: "*Champagne glass ghumate hue ek sard muskaan ke sath dekhta hai.* Line seven par sign karo, aur tumhari family ka bangla bach jayega. Par agle ek saal tak tumhara har faisla mere hisaab se hoga.",
        choices: [
          "Main sadak par aa jaunga par tumhari ghulami nahi karunga, Kabir.",
          "Mujhe board meetings mein veto power chahiye, tabhi sign karunga.",
          "Aakhir chahte kya ho tum? Seedha sach bolo na!"
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("veto") || t.includes("power") || t.includes("board")) {
            return "*Kabir table par aakar aapke kareeb jhukta hai.* Veto power? Us shaks ke liye jiske accounts kal subah freeze hone wale hain? Par agar tum mere sath har meeting mein mere bagal mein khade rahoge... toh main soch sakta hoon.";
          } else if (t.includes("sach") || t.includes("chahte") || t.includes("truth")) {
            return "*Uski muskaan gayab ho jaati hai, aankhein behad gehri ho jaati hain.* Paanch saal pehle tumhare father ne mere parivar ko barbad kar diya tha. Main badla lene aaya tha... par sach yeh hai ki main tumse door nahi reh pa raha hoon.";
          } else {
            return "*Woh pen table par slide karta hai.* Ghamand se bank ke karz nahi chukte. Contract sign karo aur kal subah 9 baje meri desk par report karo, warna parso tak sab neelam ho jayega.";
          }
        }
      },
      {
        id: "karan_bodyguard",
        title: "Karan - The Royal Bodyguard",
        category: "Romance",
        character: "Karan",
        role: "Rajnagar Princess",
        tag: "Royal Drama",
        photo: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=500&q=80",
        about: "Desert border ke paas aapke royal convoy par hamla hua. Karan aapko ek purane sandstone kile ke Jharokhe mein kheench kar bachaata hai.",
        opening: "*Jharokhe se bahar dekhte hue pistol reload karta hai.* Neeche rahiye Hukum! Unhone kile ka main gate tod diya hai. Aaj raat hum Palace Guard par bhi bharosa nahi kar sakte.",
        choices: [
          "Karan, tumhare baazu se khoon beh raha hai! Pehle mujhe dekhne do.",
          "Humein yahan aane ka route kisne leak kiya, Karan?",
          "Mujhe hathiyar do! Main chhup kar nahi baithungi."
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("khoon") || t.includes("chot") || t.includes("blood") || t.includes("baazu")) {
            return "*Woh thoda piche hat-ta hai, uski saansein tez hain.* Yeh bas mamooli chhot hai Hukum, meri jaan aapki hifazat ke liye hai. Mere ghav mat dekhiye, bas mere piche rahiye jab tak main rasta na banaun.";
          } else if (t.includes("leak") || t.includes("gaddar") || t.includes("route")) {
            return "*Woh gusse mein daant peesta hai.* Route sirf aapke chacha aur Wazir ko pata tha. Mahal ke andar koi gaddar hai jo aapko rajtilak se pehle raaste se hatana chahta hai.";
          } else {
            return "*Woh apni dusri revolver nikaal kar deta hai.* Yeh pakdiye, par tab tak trigger mat dabana jab tak koi is dehleez ke andar na aaye. Jab tak main zinda hoon, kisi ki aukaat nahi aapko chhoone ki.";
          }
        }
      },
      {
        id: "arjun_haveli",
        title: "Detective Arjun - Purani Haveli Ka Qatal",
        category: "Thriller",
        character: "Inspector Arjun",
        role: "Primary Beneficiary",
        tag: "Mystery Whodunit",
        photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80",
        about: "Bhari barsaat mein haveli ka rasta band hai. Raat ko Dadaji ka band kamre mein qatal ho chuka hai aur saari wasiyat aapke naam hai.",
        opening: "*Kaanch ke tukde check karte hue mudta hai.* Kamra andar se band tha. Is haveli mein sabhi ke paas unhe marne ki wajah thi... khaaskar tumhare paas, jiske naam saari property ho gayi hai.",
        choices: [
          "Main Dadaji se bohot pyaar karta tha, Arjun! Wasiyat ki date dekho.",
          "Khidki ka kunda bahar se toda gaya hai, Arjun. Floor par keechad ke nishaan dekho.",
          "Jab goli chali, tum kahan the inspector?"
        ],
        branch: function(m) {
          var t = m.toLowerCase();
          if (t.includes("keechad") || t.includes("khidki") || t.includes("nishaan") || t.includes("bahar")) {
            return "*Woh torch roshni deewar par maarta hai.* Geeli mitti aur garden ki bel tooti hui hai... Tumhari nazar kaafi tez hai. Matlab qatil deewar se chadkar andar ghusa tha barsaat ke waqt!";
          } else if (t.includes("wasiyat") || t.includes("pyaar") || t.includes("property")) {
            return "*Woh jeb se ek kagaz nikaalta hai.* Wasiyat kal dopehar badal di gayi thi! Dadaji sab kuch trust ko daan karne wale the. Matlab qatil ko pata tha ki agar raat se pehle qatal nahi kiya toh sab chala jayega!";
          } else {
            return "*Woh thoda muskuraata hai.* Police par shaq? Main library mein property registry check kar raha tha jab goli ki aawaz aayi. Magar tumhare kapdo par barood ki mehak kahan se aayi?";
          }
        }
      }
    ];

    var activeStory = null;
    var storyHistory = {};

    function renderStoriesCatalog(list) {
      var box = document.getElementById("storiesContainer");
      if (!list || list.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:30px; font-size:12px; color:#64748b;">Koi kahani nahi mili.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        html += '<div class="story-card" onclick="openStorySheet(\'' + s.id + '\')">';
        html += '  <img src="' + s.photo + '" class="card-photo" alt="' + s.character + '" />';
        html += '  <div class="card-info">';
        html += '    <div>';
        html += '      <span class="card-badge">' + s.tag + '</span>';
        html += '      <h3 class="card-title">' + s.title + '</h3>';
        html += '      <p class="card-desc">' + s.about + '</p>';
        html += '    </div>';
        html += '    <div class="card-meta">';
        html += '      <span class="status-dot"></span>';
        html += '      <span>Baat karein: <strong style="color:#ffffff;">' + s.character + '</strong></span>';
        html += '      <span>&bull;</span>';
        html += '      <span style="color:#c084fc;">Role: ' + s.role + '</span>';
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      }
      box.innerHTML = html;
    }

    function setCategory(cat, btn) {
      var pills = document.querySelectorAll(".category-pill");
      for (var i = 0; i < pills.length; i++) pills[i].classList.remove("active");
      if (btn) btn.classList.add("active");

      if (cat === "All") {
        renderStoriesCatalog(STORIES);
      } else {
        var filtered = STORIES.filter(s => s.category.toLowerCase() === cat.toLowerCase());
        renderStoriesCatalog(filtered);
      }
    }

    function handleSearchFilter(val) {
      var q = val.toLowerCase().trim();
      var results = STORIES.filter(s => 
        s.title.toLowerCase().includes(q) || 
        s.character.toLowerCase().includes(q) || 
        s.about.toLowerCase().includes(q) || 
        s.tag.toLowerCase().includes(q)
      );
      renderStoriesCatalog(results);
    }

    function openStorySheet(id) {
      activeStory = STORIES.find(s => s.id === id);
      if (!activeStory) return;

      document.getElementById("modalStoryTitle").innerText = activeStory.title;
      document.getElementById("modalTagBadge").innerText = activeStory.tag;
      document.getElementById("modalStoryAbout").innerText = activeStory.about;
      document.getElementById("modalCoverImg").src = activeStory.photo;
      document.getElementById("detailModal").style.display = "flex";
    }

    function dismissModal() {
      document.getElementById("detailModal").style.display = "none";
    }

    function launchChatSession() {
      dismissModal();
      document.getElementById("feedScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";
      document.getElementById("headerBackBtn").style.display = "inline-block";

      document.getElementById("chatHeaderPic").src = activeStory.photo;
      document.getElementById("chatHeaderName").innerText = activeStory.character;
      document.getElementById("chatHeaderRole").innerText = "Role: " + activeStory.role;
      document.getElementById("charTypingName").innerText = activeStory.character;

      if (!storyHistory[activeStory.id] || storyHistory[activeStory.id].length === 0) {
        storyHistory[activeStory.id] = [
          { sender: "ai", text: activeStory.opening }
        ];
      }

      renderDialogueThread();
      renderDialogueChips();
    }

    function showCatalog() {
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("feedScreen").style.display = "block";
      document.getElementById("headerBackBtn").style.display = "none";
      document.getElementById("headerTitle").innerText = "KAVANA";
      document.getElementById("headerSubtitle").innerText = "Interactive Stories (Hinglish)";
    }

    function renderDialogueThread() {
      var box = document.getElementById("chatHistory");
      var messages = storyHistory[activeStory.id] || [];
      var html = "";

      for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        if (m.sender === "user") {
          html += '<div class="user-row"><div class="user-bubble">' + formatRpText(m.text) + '</div></div>';
        } else {
          html += '<div class="ai-row">';
          html += '  <img src="' + activeStory.photo + '" style="width:28px; height:28px; border-radius:50%; object-fit:cover; margin-top:4px;" alt="avatar" />';
          html += '  <div class="ai-bubble">';
          html += '    <span class="ai-name-tag">' + activeStory.character + '</span>';
          html += '    ' + formatRpText(m.text);
          html += '  </div>';
          html += '</div>';
        }
      }

      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    function renderDialogueChips() {
      var bar = document.getElementById("chatChoicesShelf");
      if (!activeStory.choices || activeStory.choices.length === 0) {
        bar.innerHTML = "";
        return;
      }
      var html = "";
      for (var i = 0; i < activeStory.choices.length; i++) {
        var c = activeStory.choices[i];
        html += '<button type="button" class="chip-btn" onclick="selectChipChoice(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
      }
      bar.innerHTML = html;
    }

    function selectChipChoice(text) {
      document.getElementById("dialogueInput").value = text;
      handleSendDialogue(new Event("submit"));
    }

    function handleSendDialogue(e) {
      if (e && e.preventDefault) e.preventDefault();
      var input = document.getElementById("dialogueInput");
      var text = input.value.trim();
      if (!text || !activeStory) return;

      storyHistory[activeStory.id].push({ sender: "user", text: text });
      input.value = "";
      renderDialogueThread();

      var typingNotice = document.getElementById("chatTypingNotice");
      typingNotice.style.display = "block";
      var box = document.getElementById("chatHistory");
      box.scrollTop = box.scrollHeight;

      setTimeout(function() {
        var response = activeStory.branch(text);
        typingNotice.style.display = "none";
        storyHistory[activeStory.id].push({ sender: "ai", text: response });
        renderDialogueThread();
      }, 650);
    }

    function formatRpText(str) {
      var safe = str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return safe.replace(/\*(.*?)\*/g, '<span class="rp-act">$1</span>');
    }

    // Auto PWA Service Worker for Chrome Home Screen install
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    renderStoriesCatalog(STORIES);
  </script>
</body>
</html>
